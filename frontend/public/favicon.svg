<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a5fc4"/>
      <stop offset="1" stop-color="#59418f"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="118"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Listener (right) -->
    <g fill="#eaddff">
      <rect x="348" y="260" width="48" height="90" rx="20"/>
      <path d="M 262,512 C 262,376 314,322 372,322 C 430,322 486,376 486,512 Z"/>
      <circle cx="372" cy="228" r="78"/>
      <!-- ear facing the whisperer -->
      <circle cx="304" cy="234" r="14" fill="#b69df8"/>
    </g>

    <!-- Girl whispering (left), leaning toward the ear -->
    <g transform="rotate(12 170 300)" fill="#ffffff">
      <rect x="140" y="235" width="52" height="130" rx="22"/>
      <path d="M 58,512 C 58,398 110,348 166,344 C 210,341 246,364 258,392 L 258,512 Z"/>
      <!-- hair back + top -->
      <circle cx="150" cy="196" r="72"/>
      <!-- bun -->
      <circle cx="92" cy="140" r="27"/>
      <!-- face -->
      <circle cx="176" cy="220" r="52" fill="#ffd8e4"/>
      <!-- nose -->
      <path d="M 222,198 L 244,212 L 220,226 Z" fill="#ffd8e4"/>
    </g>

    <!-- cupped hand -->
    <path d="M 252,168 C 294,190 298,246 252,266" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>

    <!-- whisper marks radiating toward the ear -->
    <g stroke="#ffd8e4" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M 284,152 L 300,138"/>
      <path d="M 300,182 L 322,174"/>
      <path d="M 302,210 L 326,208"/>
    </g>
  </g>
</svg>
