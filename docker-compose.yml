name: kurakaani

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-chat-app-db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    # Internal-only by default (avoids clashing with a Postgres already on the host).
    # To reach it from the host, add a docker-compose.override.yml mapping "5432:5432".
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-chat-app-db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Internal-only by default (host may already run Redis on 6379).
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage (RustFS). Swap for MinIO if preferred.
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
    # Internal-only by default; the frontend proxies /storage to it over the compose network.
    volumes:
      - storage-data:/data

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-chat-app-db}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kurakaani}
      STORAGE_REGION: ${STORAGE_REGION:-rustfs}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      JWT_SECRET: ${JWT_SECRET:-VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdTZWNyZXRLZXlGb3JIUzI1Ng==}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # No SMTP creds locally -> don't let the mail health check mark the app DOWN.
      # Set MAIL_USERNAME/MAIL_PASSWORD and remove this to actually send mail.
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_GLOBAL_ROOM_ID: ${VITE_GLOBAL_ROOM_ID:-1}
    depends_on:
      - backend
    environment:
      # Runtime proxy targets used by `vite preview`
      VITE_BACKEND_PROXY_TARGET: http://backend:8080
      VITE_STORAGE_PROXY_TARGET: http://storage:9000
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  redis-data:
  storage-data:
